name: Chimera 1 - code checks (no model download)
on:
  push:
    branches: [main, 'chimera/**']
  pull_request:

jobs:
  stdlib-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project without heavyweight ML dependencies
        run: python -m pip install -e .
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Validate data
        run: python -m chimera_lab validate-data
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Basic machine diagnostic
        run: python -m chimera_lab doctor
