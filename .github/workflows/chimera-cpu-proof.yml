name: Chimera 1 - free CPU real-weight pilot
on:
  push:
    branches: ['chimera/003-free-cpu-training']
    paths:
      - '.github/workflows/chimera-cpu-proof.yml'
      - 'src/chimera_lab/cpu_proof.py'
      - 'data/chimera1_cpu_proof_train.jsonl'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-real-weights:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch
        run: python -m pip install --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install official model and LoRA libraries
        run: python -m pip install --no-cache-dir transformers==4.57.1 peft==0.17.1 accelerate==1.11.0 safetensors==0.6.2
      - name: Verify available RAM and disk
        run: free -h && df -h .
      - name: Train new LoRA weights and reload the model
        run: python -u src/chimera_lab/cpu_proof.py
      - name: Upload REAL adapter and verification report if successful
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chimera1-cpu-proof-real-weights
          path: outputs/chimera1_cpu_proof/
          retention-days: 30
          if-no-files-found: error
