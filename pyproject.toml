[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera-lab"
version = "0.1.0"
description = "Reproducible local experiments for Chimera 1 (before Gary Baldi)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "transformers>=4.51,<5",
    "accelerate>=0.34",
    "peft>=0.13",
    "bitsandbytes>=0.45",
    "safetensors>=0.4",
]

[project.scripts]
chimera = "chimera_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
